<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges" role="img" aria-label="Erik — pixel avatar">
  <title>Erik — pixel avatar</title>
  <rect width="32" height="32" fill="#0b0f19" />
  <!-- halo / glow -->
  <rect x="6" y="2" width="20" height="2" fill="#38bdf8" opacity=".35" />
  <rect x="4" y="4" width="24" height="2" fill="#38bdf8" opacity=".22" />
  <!-- hair -->
  <rect x="8" y="6" width="16" height="4" fill="#38bdf8" />
  <rect x="6" y="8" width="2" height="6" fill="#38bdf8" />
  <rect x="24" y="8" width="2" height="6" fill="#38bdf8" />
  <rect x="8" y="10" width="16" height="4" fill="#a855f7" opacity=".55" />
  <!-- face -->
  <rect x="10" y="12" width="12" height="10" fill="#e2e8f0" />
  <!-- eyes -->
  <rect x="12" y="16" width="2" height="2" fill="#0b0f19" />
  <rect x="18" y="16" width="2" height="2" fill="#0b0f19" />
  <rect x="12" y="16" width="1" height="1" fill="#38bdf8" />
  <rect x="18" y="16" width="1" height="1" fill="#38bdf8" />
  <!-- mouth -->
  <rect x="14" y="20" width="4" height="2" fill="#f59e0b" />
  <!-- shoulders -->
  <rect x="4" y="22" width="24" height="2" fill="#34d399" opacity=".7" />
  <rect x="8" y="24" width="16" height="6" fill="#34d399" opacity=".28" />
</svg>